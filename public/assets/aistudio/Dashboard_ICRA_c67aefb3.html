<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard ICRA – Infection Control Risk Assessment</title>
<style>
:root{
  --plane:#f4f5f2; --surface:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:#e6e5df;
  --brand:#0f4c5c; --brand2:#13677b; --brand-soft:#e3f0f2; --accent:#2a78d6;
  --low:#0ca30c; --mod:#fab219; --high:#ec835a; --sig:#d03b3b;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--plane);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--brand);color:#e9f3f4;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.logo-mark{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.logo b{display:block;font-size:15px}.logo small{opacity:.75;font-size:11.5px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;opacity:.86}
nav button:hover{background:rgba(255,255,255,.08);opacity:1}
nav button.active{background:#fff;color:var(--brand);opacity:1;font-weight:600}
nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:11.5px;opacity:.8;padding:10px 6px;border-top:1px solid rgba(255,255,255,.14)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7be07b;margin-right:6px}
main{padding:22px 28px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:22px;margin:0 0 2px}
.page-head p{margin:0;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{color:var(--ink2);font-size:12.5px;margin:0 0 10px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g3{grid-template-columns:1fr}}
.prio-wrap{border-top:4px solid #d03b3b;margin-bottom:14px}
.prio{border:1px solid #f0c9c9;background:#fff7f7;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prio-top{display:flex;justify-content:space-between;align-items:center}
.prio-badge{background:#d03b3b;color:#fff;font-weight:700;font-size:12px;letter-spacing:.4px;padding:3px 10px;border-radius:99px}
.prio-score{font-size:34px;font-weight:800;color:#b42323;line-height:1;font-variant-numeric:tabular-nums}
.prio-score small{font-size:12px;font-weight:500;color:var(--ink2);display:block;text-align:right}
.prio-item{border-top:1px dashed #efc3c3;padding-top:7px}
.prio-item b{display:block;font-size:14.5px}
.prio-meta{font-size:12px;color:var(--ink2)}
.rk-top{display:inline-block;min-width:24px;padding:1px 6px;border-radius:6px;background:#d03b3b;color:#fff;font-weight:700}
@media (max-width:1200px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.g2{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto}.side-foot{display:none}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .lbl{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .note{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--axis);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2);color:#fff}
.btn.danger{color:#b42323;border-color:#e7b4b4}
.btn.danger:hover{background:#fbeaea}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:15px;height:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{border:1px solid var(--axis);border-radius:8px;padding:7px 10px;background:#fff;min-width:0;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec5f4;border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
@media (max-width:760px){.form-grid{grid-template-columns:1fr 1fr}}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{border:1px solid var(--axis);border-radius:8px;padding:7px 6px;cursor:pointer;text-align:center;font-size:12px;line-height:1.25;background:#fff;color:var(--ink2);min-height:58px;display:flex;flex-direction:column;justify-content:center}
.scale label b{font-size:16px;color:var(--ink)}
.scale input:checked+label{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.scale input:focus-visible+label{outline:2px solid #9ec5f4}
.scale-hint{font-size:12px;color:var(--ink2);margin-top:4px;min-height:17px}
.score-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--axis);border-radius:10px;padding:12px 16px}
.score-box .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.score-box .cap{font-size:12px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--axis);white-space:nowrap}
.pill.Selesai{background:#e6f6e6;border-color:#9fd89f;color:#185c18}
.pill.Proses{background:#fff5df;border-color:#f3d48e;color:#7a5200}
.pill.Belum{background:#f1f1ef;color:#55544f}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{position:sticky;top:0;background:#eef3f4;text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--axis);cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
table.dt th.nosort{cursor:default}
table.dt td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tr:hover td{background:#fafaf7}
table.dt td.num,table.dt th.num{text-align:center;font-variant-numeric:tabular-nums}
.table-wrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.muted{color:var(--muted)}.small{font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.toolbar .grow{flex:1}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.empty{padding:28px;text-align:center;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:#0b0b0b;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:7px;max-width:320px;z-index:50;display:none;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:980px;width:100%;padding:20px 22px}
.modal h2{margin:0 0 6px;font-size:18px}
.banner{background:#fff8e6;border:1px solid #f3d48e;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ref-table{border-collapse:collapse;width:100%;font-size:13px}
.ref-table td,.ref-table th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.ref-table th{background:#eef3f4}
.hidden{display:none!important}
body:not(.mode-server) .server-only{display:none!important}
body.mode-server:not(.role-admin) .admin-only{display:none!important}
body.role-pimpinan .write-only{display:none!important}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0f4c5c,#13677b);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
#login form{background:#fff;border-radius:14px;padding:28px 28px 22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.user-chip{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.user-chip button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11.5px}
body.mode-view .edit-only,body.src-excel .edit-only,body.src-excel .dash-only{display:none!important}
.mode-tag{display:inline-block;margin-top:4px;background:#fff;color:var(--brand);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;letter-spacing:.3px}
.steps{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--ink2)}.steps li{margin:3px 0}
.print-head{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  aside,.no-print,.btn,#tip,#toast{display:none!important}
  .app{display:block}
  main{padding:0}
  .card,.kpi{break-inside:avoid;border-color:#ccc}
  .print-head{display:block;margin-bottom:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g-kpi{grid-template-columns:repeat(5,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .table-wrap{max-height:none;overflow:visible}
}
</style>
</head>

<aside>

  </nav>
  <div class="side-foot"><div><span class="dot"></span>Data tersimpan di komputer ini</div><div id="sideCount" style="margin-top:4px"></div><div id="sideBackup" style="margin-top:2px"></div></div>
</aside>
<main id="main"></main>
</div>
<div id="tip"></div><div id="toast"></div>
<div id="login"><form id="loginForm" autocomplete="on"><div style="display:flex;gap:10px;align-items:center"><div class="logo-mark" style="background:var(--brand);color:#fff">ICRA</div><div><b style="font-size:17px">Dashboard ICRA</b><div class="small muted" id="loginHosp">Komite PPI</div></div></div>
<p class="small muted" style="margin:0">Masuk dengan akun yang diberikan oleh Komite PPI.</p>
<label class="f">Username<input type="text" name="username" autocomplete="username" required autofocus></label>
<label class="f">Password<input type="password" name="password" autocomplete="current-password" required></label>
<div id="loginErr" class="small" style="color:#b42323;min-height:16px"></div>
<button class="btn primary" style="justify-content:center">Masuk</button>
<p class="small muted" style="margin:0;text-align:center">Akses hanya dari jaringan internal rumah sakit</p></form></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm" class="hidden">

const DB = {
  db:null, records:[], settings:{},
  open(){return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('Browser tidak mendukung IndexedDB'));return}
    const rq=indexedDB.open(MODE==='dept'?'icra_departemen_db':'icra_dashboard_db',1);
    rq.onupgradeneeded=()=>{const d=rq.result;
      if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});
      if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});};
    rq.onsuccess=()=>{this.db=rq.result;res()};rq.onerror=()=>rej(rq.error);
  })},
  tx(store,mode){return this.db.transaction(store,mode).objectStore(store)},
  all(store){return new Promise((res,rej)=>{const r=this.tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async load(){this.records=await this.all('records');const s=await this.all('settings');this.settings=Object.fromEntries(s.map(x=>[x.key,x.value]))},
  putMany(recs){return new Promise((res,rej)=>{const t=this.db.transaction('records','readwrite');const st=t.objectStore('records');recs.forEach(r=>st.put(r));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async save(rec){rec.updatedAt=new Date().toISOString();await this.putMany([rec]);const i=this.records.findIndex(x=>x.id===rec.id);if(i>=0)this.records[i]=rec;else this.records.push(rec)},
  async saveMany(recs){const now=new Date().toISOString();recs.forEach(r=>r.updatedAt=r.updatedAt||now);await this.putMany(recs);const m=new Map(this.records.map(r=>[r.id,r]));recs.forEach(r=>m.set(r.id,r));this.records=[...m.values()]},
  del(ids){return new Promise((res,rej)=>{const t=this.db.transaction('records','readwrite');const st=t.objectStore('records');ids.forEach(id=>st.delete(id));t.oncomplete=()=>{const s=new Set(ids);this.records=this.records.filter(r=>!s.has(r.id));res()};t.onerror=()=>rej(t.error)})},
  clear(){return new Promise((res,rej)=>{const t=this.db.transaction('records','readwrite');t.objectStore('records').clear();t.oncomplete=()=>{this.records=[];res()};t.onerror=()=>rej(t.error)})},
  setSetting(key,value){this.settings[key]=value;return new Promise((res,rej)=>{const t=this.db.transaction('settings','readwrite');t.objectStore('settings').put({key,value});t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  get S(){return Object.assign({},{hospital:'Siloam Hospitals TB Simatupang',year:new Date().getFullYear(),maker:'Geyner Molinsqe Pattileuw',makerRole:'Infection Prevention Control Nurse',chair:'dr. Iradewi Karseno, SpAn-KAKV-KIC',chairRole:'Ketua Komite Pencegahan dan Pengendalian Infeksi',director:'dr. Dewi Wiguna, M.Sc',directorRole:'Direktur'},CONFIG.profile||{},this.settings.profile||{})}
};

/* ranking: prioritas = urutan (dense) skor tertinggi dalam tiap Tahun + Unit */
function ranks(recs){
  const groups={};recs.forEach(r=>{(groups[r.tahun+'|'+r.unit]??=[]).push(r)});
  const m={};
  for(const g of Object.values(groups)){
    const scores=[...new Set(g.map(r=>calc(r).score))].sort((a,b)=>b-a);
    g.forEach(r=>m[r.id]=scores.indexOf(calc(r).score)+1);
  }
  return m;
}
function denseRank(list){const sc=[...new Set(list.map(r=>calc(r).score))].sort((a,b)=>b-a);const m={};list.forEach(r=>m[r.id]=sc.indexOf(calc(r).score)+1);return m}

/* ===================== CHART (SVG) ===================== */
const FONT='Segoe UI, system-ui, Arial, sans-serif';
function roundedBar(x,y,w,h,dir){ // dir 'r' = rounded right end, 't' = rounded top
  const r=Math.max(0,Math.min(4,w/2,h/2));
  if(w<=0||h<=0) return '';
  if(dir==='r') return `M${x},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h-r}Q${x+w},${y+h} ${x+w-r},${y+h}H${x}Z`;
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
function svgWrap(w,h,inner,title){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" font-family="${FONT}" role="img" aria-label="${esc(title)}" data-title="${esc(title)}"><rect width="${w}" height="${h}" fill="#ffffff"/>${inner}</svg>`}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function ticks(max,n=5){const step=niceMax(max/n);const out=[];for(let v=0;v<=max+1e-9;v+=step)out.push(+v.toFixed(6));return out}

/* horizontal bar; rows:[{label, segs:[{v,color,tip}], total, totalLabel}] */
function hbarChart(rows,{title,labelW=250,width=640,barH=18,gap=8,xMax=null,axisLabel=''}={}){
  if(!rows.length) return `<div class="empty">Belum ada data</div>`;
  const top=8,bottom=34,right=40,h=top+rows.length*(barH+gap)+bottom;
  const max=xMax||niceMax(Math.max(...rows.map(r=>r.total)));
  const pw=width-labelW-right; const sx=v=>v/max*pw;
  let s='';
  ticks(max).forEach(t=>{const x=labelW+sx(t);s+=`<line x1="${x}" x2="${x}" y1="${top-4}" y2="${h-bottom+2}" stroke="#e1e0d9" stroke-width="1"/><text x="${x}" y="${h-bottom+16}" font-size="11" fill="#52514e" text-anchor="middle">${t}</text>`});
  if(axisLabel) s+=`<text x="${labelW+pw/2}" y="${h-4}" font-size="11" fill="#52514e" text-anchor="middle">${esc(axisLabel)}</text>`;
  rows.forEach((r,i)=>{
    const y=top+i*(barH+gap);
    s+=`<text x="${labelW-8}" y="${y+barH/2+4}" font-size="12" fill="#0b0b0b" text-anchor="end">${esc(trunc(r.label,Math.floor(labelW/7.2)))}</text>`;
    let x=labelW;const segs=r.segs.filter(g=>g.v>0);
    segs.forEach((g,j)=>{const last=j===segs.length-1;let w=sx(g.v);const drawW=last?w:Math.max(0,w-2);
      s+=`<path d="${last?roundedBar(x,y,drawW,barH,'r'):`M${x},${y}h${drawW}v${barH}h${-drawW}Z`}" fill="${g.color}" data-tip="${esc(g.tip)}"/>`;x+=w});
    s+=`<text x="${x+6}" y="${y+barH/2+4}" font-size="12" font-weight="600" fill="#0b0b0b">${esc(r.totalLabel??r.total)}</text>`;
    s+=`<rect x="0" y="${y-gap/2}" width="${width}" height="${barH+gap}" fill="transparent" data-tip="${esc(r.rowTip||'')}" ${r.rowTip?'':'style="display:none"'}/>`;
  });
  s+=`<line x1="${labelW}" x2="${labelW}" y1="${top-4}" y2="${h-bottom+2}" stroke="#c3c2b7"/>`;
  return svgWrap(width,h,s,title);
}
/* vertical columns; cols:[{label, segs:[{v,color,tip}]}] */
function vbarChart(cols,{title,width=640,height=260,yLabel=''}={}){
  if(!cols.length) return `<div class="empty">Belum ada data</div>`;
  const left=44,right=12,top=14,bottom=46;const pw=width-left-right,ph=height-top-bottom;
  const tot=cols.map(c=>c.segs.reduce((a,g)=>a+g.v,0));const max=niceMax(Math.max(1,...tot));
  const sy=v=>v/max*ph;const slot=pw/cols.length;const bw=Math.min(64,slot*0.6);
  let s='';
  ticks(max).forEach(t=>{const y=top+ph-sy(t);s+=`<line x1="${left}" x2="${width-right}" y1="${y}" y2="${y}" stroke="#e1e0d9"/><text x="${left-6}" y="${y+4}" font-size="11" fill="#52514e" text-anchor="end">${t}</text>`});
  if(yLabel) s+=`<text transform="translate(12 ${top+ph/2}) rotate(-90)" font-size="11" fill="#52514e" text-anchor="middle">${esc(yLabel)}</text>`;
  cols.forEach((c,i)=>{
    const x=left+i*slot+(slot-bw)/2;let y=top+ph;const segs=c.segs.filter(g=>g.v>0);
    segs.forEach((g,j)=>{const last=j===segs.length-1;const hh=sy(g.v);const dh=last?hh:Math.max(0,hh-2);
      s+=`<path d="${last?roundedBar(x,y-hh,bw,hh,'t'):`M${x},${y-dh}h${bw}v${dh}h${-bw}Z`}" fill="${g.color}" data-tip="${esc(g.tip)}"/>`;y-=hh});
    s+=`<text x="${x+bw/2}" y="${y-6}" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">${tot[i]}</text>`;
    const lines=String(c.label).split('\n');
    lines.forEach((ln,k)=>s+=`<text x="${x+bw/2}" y="${top+ph+16+k*13}" font-size="11.5" fill="${k?'#52514e':'#0b0b0b'}" text-anchor="middle">${esc(ln)}</text>`);
  });
  s+=`<line x1="${left}" x2="${width-right}" y1="${top+ph}" y2="${top+ph}" stroke="#c3c2b7"/>`;
  return svgWrap(width,height,s,title);
}
/* matriks 5x5 likelihood x impact */
const MX_COL=v=>v>=15?'#ff5a5a':v>=10?'#ffd24d':v>=5?'#ffff00':'#2eff8e';
const MX_LEG=[['#2eff8e','L×I 1–4'],['#ffff00','L×I 5–9'],['#ffd24d','L×I 10–12'],['#ff5a5a','L×I 15–25']];
function matrixCells(recs,rk){
  const m={};recs.forEach(r=>{(m[r.L+'_'+r.I]??=[]).push(r)});
  const cells=Object.values(m).map(items=>{items.sort((a,b)=>calc(b).score-calc(a).score);const ps=uniq(items.map(r=>rk[r.id]).filter(p=>p<=3)).sort();
    return {L:items[0].L,I:items[0].I,items,max:calc(items[0]).score,best:Math.min(...items.map(r=>rk[r.id]||999)),ps}});
  cells.sort((a,b)=>a.best-b.best||b.max-a.max||b.L*b.I-a.L*a.I||b.items.length-a.items.length);
  cells.forEach((c,i)=>c.no=i+1);return cells;
}
function matrixKeyTable(recs,rk){
  const cells=matrixCells(recs,rk);if(!cells.length)return '';
  return `<div class="table-wrap" style="margin-top:10px;max-height:260px"><table class="dt"><thead><tr><th class="nosort num">Titik</th><th class="nosort num">L × I</th><th class="nosort num">Jumlah risiko</th><th class="nosort num">Skor ICRA tertinggi</th><th class="nosort">Risiko pada titik ini</th></tr></thead><tbody>${cells.map(c=>`<tr><td class="num"><span class="rk-top" style="background:${c.ps.length?'#b42323':'#1f2937'};border-radius:99px">${c.no}</span></td><td class="num" style="white-space:nowrap">${c.L} × ${c.I}</td><td class="num">${c.items.length}</td><td class="num"><b>${c.max}</b></td><td class="small">${c.items.slice(0,3).map(r=>esc(r.masalah)+(rk[r.id]<=3?` <b style="color:#b42323">(P${rk[r.id]})</b>`:'')).join('; ')}${c.items.length>3?` <span class="muted">+${c.items.length-3} lainnya</span>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
function matrixChart(recs,{title,rk={}}){
  const W=660,H=420,gL=104,gR=560,gT=22,gB=332,cw=(gR-gL)/5,ch=(gB-gT)/5;
  const X=l=>gL+(l-1)*cw, Y=i=>gT+(5-i)*ch; // likelihood -> kolom, impact -> baris (5 di atas)
  const cnt={};matrixCells(recs,rk).forEach(c=>cnt[c.L+'_'+c.I]=c);
  const IMS={1:'Minimal',2:'Moderate',3:'Prolonged',4:'Serious',5:'Catastrophic'};
  let s='',ov='';
  for(let i=5;i>=1;i--)for(let l=1;l<=5;l++){
    const x=X(l),y=Y(i),v=l*i,cell=cnt[l+'_'+i],items=cell?cell.items:[];
    const tipTxt=`<b>${cell?'Titik '+cell.no+' · ':''}Likelihood ${l} × Impact ${i} = ${v}</b><br>`+(items.length?`${items.length} risiko:<br>`+items.slice(0,10).map(r=>`• ${esc(trunc(r.masalah,55))} — skor ICRA <b>${calc(r).score}</b> (${calc(r).level})${rk[r.id]<=3?' · <b>Prioritas '+rk[r.id]+'</b>':''}`).join('<br>')+(items.length>10?'<br>…':''):'Tidak ada risiko');
    s+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="${MX_COL(v)}" data-tip="${esc(tipTxt)}"/>`;
    s+=`<text x="${x+5}" y="${y+21}" font-size="15" fill="#1f3b5c" pointer-events="none">${v}</text>`;
    if(items.length){const cx=x+cw/2-12,cy=y+ch/2+4;const ps=cell.ps;
      ov+=`<circle cx="${cx}" cy="${cy}" r="15" fill="${ps.length?'#b42323':'#1f2937'}" stroke="#fff" stroke-width="2" pointer-events="none"/><text x="${cx}" y="${cy+5}" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" pointer-events="none">${cell.no}</text>`;
      if(ps.length)ov+=`<text x="${cx+19}" y="${cy-1}" font-size="11" font-weight="700" fill="#7a1010" pointer-events="none">${ps.map(p=>'P'+p).join(',')}</text>`;
      ov+=`<text x="${cx+19}" y="${cy+(ps.length?12:4)}" font-size="10" fill="#1f2937" pointer-events="none">${items.length} risiko</text>`;}
  }
  // garis putus-putus antar sel (lingkaran digambar setelah ini) + bingkai tebal
  for(let k=1;k<5;k++){s+=`<line x1="${gL+k*cw}" x2="${gL+k*cw}" y1="${gT}" y2="${gB}" stroke="#555" stroke-width="1" stroke-dasharray="1.5 2.5"/><line x1="${gL}" x2="${gR}" y1="${gT+k*ch}" y2="${gT+k*ch}" stroke="#555" stroke-width="1" stroke-dasharray="1.5 2.5"/>`}
  s+=`<rect x="${gL}" y="${gT}" width="${gR-gL}" height="${gB-gT}" fill="none" stroke="#000" stroke-width="2.5"/>`;
  s+=ov;
  // garis toleransi risiko
  const tol=`M${X(2)},4 V${Y(4)} H${X(3)} V${Y(3)} H${X(4)} V${Y(2)} H${X(5)} V${Y(1)} H${W-4}`;
  s+=`<path d="${tol}" fill="none" stroke="#e00000" stroke-width="2.2" stroke-dasharray="9 5" pointer-events="none"/>`;
  s+=`<text font-size="11" fill="#e00000"><tspan x="${gR+8}" y="${Y(1)+16}">Garis</tspan><tspan x="${gR+8}" y="${Y(1)+29}">Toleransi</tspan><tspan x="${gR+8}" y="${Y(1)+42}">Risiko</tspan></text>`;
  // label sumbu
  for(let i=1;i<=5;i++){const cy=Y(i)+ch/2;s+=`<text x="${gL-30}" y="${cy+4}" font-size="12" fill="#0b0b0b" text-anchor="middle">${i}</text><text transform="translate(${gL-12} ${cy}) rotate(-90)" font-size="9.5" fill="#0b0b0b" text-anchor="middle">(${IMS[i]})</text>`}
  for(let l=1;l<=5;l++){const cx=X(l)+cw/2;s+=`<text x="${cx}" y="${gB+15}" font-size="12" fill="#0b0b0b" text-anchor="middle">${l}</text><text x="${cx}" y="${gB+29}" font-size="11.5" fill="#0b0b0b" text-anchor="middle">(${esc(SC.L.lbl[l])})</text>`}
  s+=`<rect x="4" y="${gT}" width="24" height="${gB-gT}" fill="#fff" stroke="#000" stroke-width="1.5"/><text transform="translate(21 ${(gT+gB)/2}) rotate(-90)" font-size="13" font-weight="800" fill="#000" text-anchor="middle">IMPACT / CONSEQUENCES</text>`;
  s+=`<rect x="${gL}" y="${gB+40}" width="${gR-gL}" height="22" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="${(gL+gR)/2}" y="${gB+56}" font-size="13" font-weight="800" fill="#000" text-anchor="middle">PROBABILITY / LIKELIHOOD</text>`;
  return svgWrap(W,H,s,title);
}
async function svgToPng(svgEl,name,withLegend){
  const vb0=svgEl.viewBox.baseVal;withLegend=withLegend&&withLegend.length?withLegend:null;const head=withLegend?58:36;
  let leg='';if(withLegend){let x=0;withLegend.forEach(([col,t])=>{leg+=`<rect x="${x}" y="0" width="10" height="10" rx="2" fill="${col}"/><text x="${x+15}" y="9.5" font-size="11.5" fill="#52514e">${esc(t)}</text>`;x+=t.length*6.4+34})}
  const sub=esc(DB.S.hospital)+' · '+esc(UI.dash.unit||'Semua unit')+' · '+(UI.dash.tahun===''?'Semua tahun':'Tahun '+UI.dash.tahun);
  const wrapped=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vb0.width} ${vb0.height+head+6}" font-family="${FONT}"><rect width="100%" height="100%" fill="#fff"/><text x="10" y="18" font-size="15" font-weight="700" fill="#0b0b0b">${esc(name)}</text><text x="${vb0.width-10}" y="18" font-size="11" fill="#52514e" text-anchor="end">${sub}</text>${withLegend?`<g transform="translate(10 34)">${leg}</g>`:''}<g transform="translate(0 ${head+6})">${svgEl.innerHTML}</g></svg>`;
  const xml=wrapped;const vb={width:vb0.width,height:vb0.height+head+6};const scale=2.5;
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  await img.decode();
  const c=document.createElement('canvas');c.width=vb.width*scale;c.height=vb.height*scale;
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>download(b,name.replace(/[^\w\-]+/g,'_')+'.png'),'image/png');
}

function scaleHTML(key,val){
  return `<div class="scale" role="radiogroup" aria-label="${SC[key].name}">${[5,4,3,2,1].map(v=>`<input type="radio" name="${key}" id="${key}${v}" value="${v}" ${+val===v?'checked':''}><label for="${key}${v}" title="${esc(SC[key].desc[v])}"><b>${v}</b>${esc(SC[key].lbl[v])}</label>`).join('')}</div><div class="scale-hint" id="${key}hint"></div>`;
}
function suggestionsFor(unit){
  const s=(SEED&&SEED.suggestions&&SEED.suggestions[unit])||[];
  return uniq([...DB.records.filter(r=>r.unit===unit).map(r=>r.masalah),...s.map(x=>x.masalah)]);
}
function masterSources(){
  const src=[];const pick=r=>({grup:r.grup||'',subgrup:r.subgrup||'',masalah:r.masalah});
  if(SEED){
    if(SEED.master&&SEED.master.items.length)src.push({k:'Sheet '+SEED.master.label,items:SEED.master.items.map(pick)});
    const a=SEED.records.filter(r=>r.unit==='Seluruh Departemen').map(pick);if(a.length)src.push({k:'Sheet ICRA ALL DEP 26 (Seluruh Departemen)',items:a});
    const b=SEED.records.filter(r=>r.unit==='RS SHTB (Prioritisasi)').map(pick);if(b.length)src.push({k:'Sheet ICRA SHTB 26',items:b});
    Object.entries(SEED.suggestions||{}).forEach(([u,list])=>{if(list.length)src.push({k:'Sheet ICRA '+u,items:list.map(x=>({grup:x.grup||'',subgrup:u,masalah:x.masalah}))})});
  }
  const known=new Set(src.flatMap(s=>s.items.map(i=>norm(i.masalah))));const seen=new Set();
  const own=[...DB.records].sort((a,b)=>(a.seq||0)-(b.seq||0)).filter(r=>{const k=norm(r.masalah);if(known.has(k)||seen.has(k))return false;seen.add(k);return true}).map(pick);
  if(own.length)src.push({k:'Ketikan manual yang sudah tersimpan',items:own});
  return src;
}
function comboHTML(key,main,extra,value,label,ph,allowNew=true){
  const all=uniq([...main,...extra]);const v=String(value||'');const inList=!v||all.includes(v);
  const opt=x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`;
  const ex=extra.filter(x=>!main.includes(x));
  return `<label class="f">${label}<select data-combo="${key}"><option value="" ${!v?'selected':''}>— pilih —</option>${main.map(opt).join('')}${ex.length?`<optgroup label="Lainnya (sudah ada di data)">${ex.map(opt).join('')}</optgroup>`:''}${allowNew?`<option value="${NEW_OPT}" ${inList?'':'selected'}>➕ Tambah baru (ketik manual)…</option>`:''}</select>
    <input type="text" name="${key}" value="${esc(v)}" placeholder="${esc(ph)}" class="${inList?'hidden':''}" style="margin-top:6px"></label>`;
}
function setCombo(f,key,val){

    if(MODE==='server'&&!canEdit({unit:f.unit.value.trim()})){toast('Anda hanya dapat mengisi data unit: '+ME.units.join(', '));return}
    if(!f.masalah.value.trim()){toast('Pilih potensial risiko atau ketik yang baru');$('#mSel').focus();return}
    if(!L||!I||!Sv){toast('Lengkapi nilai Likelihood, Impact dan Current System');return}
    const now=new Date().toISOString();
    const rec=Object.assign(ed?{...ed}:{id:uid(),seq:maxSeq()+1,createdAt:now},{
      tahun:+f.tahun.value,unit:f.unit.value.trim(),grup:f.grup.value.trim(),subgrup:f.subgrup.value.trim(),masalah:f.masalah.value.trim(),
      L,I,S:Sv,status:(ed&&ed.status)||'Belum',tujuan:f.tujuan.value.trim(),indikator:f.indikator.value.trim(),rencana:f.rencana.value.trim(),
      pic:f.pic.value.trim(),target:f.target.value.trim(),bukti:f.bukti.value.trim(),ket:f.ket.value.trim()});
    if(!ed){const dup=DB.records.find(x=>+x.tahun===rec.tahun&&x.unit===rec.unit&&norm(x.masalah)===norm(rec.masalah));
      if(dup&&!confirm('Masalah yang sama sudah ada untuk tahun & unit ini. Tetap simpan sebagai data baru?'))return;}
    try{await DB.save(rec)}catch(err){alert('Gagal menyimpan: '+err.message);return}clearDraft();
    toast(ed?'Perubahan disimpan':'Data tersimpan ✓  Skor '+calc(rec).score);
    if(ed){UI.input.editId=null;render();return}
    const keep=$('#keepCtx')?.checked;
    UI.input.tahun=rec.tahun;UI.input.unit=rec.unit;
    render();
    if(keep){const f2=$('#frm');setCombo(f2,'grup',rec.grup);setCombo(f2,'subgrup',rec.subgrup);$('#mSel').focus()}
  };
}

/* ===================== VIEW: DATA ===================== */
function filteredData(){
  const d=UI.data,q=norm(d.q),rk=ranks(DB.records);
  let list=DB.records.filter(r=>(!d.tahun||+r.tahun===+d.tahun)&&(!d.unit||r.unit===d.unit)&&(!d.level||calc(r).level===d.level)
    &&(!q||norm([r.masalah,r.grup,r.subgrup,r.unit,r.rencana,r.pic,r.ket].join(' ')).includes(q)));
  const key={prio:r=>rk[r.id],tahun:r=>r.tahun,unit:r=>r.unit,grup:r=>r.grup,masalah:r=>r.masalah,L:r=>r.L,I:r=>r.I,S:r=>r.S,li:r=>r.L*r.I,score:r=>calc(r).score,status:r=>STATUS.indexOf(r.status),seq:r=>r.seq||0}[d.sort]||(r=>rk[r.id]);
  list.sort((a,b)=>{const x=key(a),y=key(b);return (typeof x==='string'?x.localeCompare(y):x-y)*d.dir||(a.seq||0)-(b.seq||0)});
  return {list,rk};
}

/* ---- isi workbook ICRA ---- */
function sheetICRA(tahun,unit,recs,rk){
  const S=DB.S;const sh=new XSheet(`${String(unit).slice(0,25).trim()} ${tahun}`);
  const LC=4,IC=9,OC=14,PC=15,SCc=16,VC=21,WC=22; // kolom E, J, O, P, Q, V, W
  sh.set(0,0,'Infection Control Risk Assessment',X.title).merge(0,0,0,WC);
  sh.set(1,0,`${S.hospital} · ${unit} · Tahun ${tahun}`,X.title).merge(1,0,1,WC);sh.heights[0]=22;sh.heights[1]=22;
  const h0=3;
  [['NO',0],['GRUP RISIKO (Kategori)',1],['SUB GRUP (Sub Kategori)',2],['POTENSIAL RISK / MASALAH',3],['Skor L×I',OC],['Tingkat Risiko (skor ICRA)',PC],['Score',VC],['Prioritas',WC]].forEach(([t,c])=>{sh.set(h0,c,t,X.headDark);sh.set(h0+1,c,'',X.headDark);sh.set(h0+2,c,'',X.headDark);sh.merge(h0,c,h0+2,c)});
  [['Likelihood / Probability',LC,'L'],['Consequences / Impact',IC,'I'],['Current Systems',SCc,'S']].forEach(([t,c,k])=>{
    sh.set(h0,c,t,X.headDark);for(let i=1;i<5;i++)sh.set(h0,c+i,'',X.headDark);sh.merge(h0,c,h0,c+4);
    [5,4,3,2,1].forEach((v,i)=>{sh.set(h0+1,c+i,k==='I'?{5:'Catastropic loss (life / limb / function / financial / legal)',4:'Serious loss (function / financial / legal)',3:'Prolonged length of stay',2:'Moderate clinical / financial',1:'Minimal clinical / financial'}[v]:SC[k].lbl[v],X.head);sh.set(h0+2,c+i,v,X.head)})});
  sh.heights[h0+1]=78;sh.freeze=h0+3;
  [5,28,20,46].forEach((w,c)=>sh.width(c,w));for(let c=4;c<=20;c++)sh.width(c,c>=9&&c<=13?9.5:7.5);sh.width(OC,8);sh.width(PC,14);sh.width(VC,8);sh.width(WC,9);
  // urut per grup sesuai urutan input
  const order=[];const byG={};[...recs].sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(r=>{const g=r.grup||'(Tanpa grup)';if(!byG[g]){byG[g]=[];order.push(g)}byG[g].push(r)});
  let row=h0+3,no=0;
  for(const g of order){const start=row;no++;
    for(const r of byG[g]){const c=calc(r);const R=row+1;
      sh.set(row,0,row===start?no:'',X.num);sh.set(row,1,row===start?g:'',X.text);sh.set(row,2,r.subgrup,X.text);sh.set(row,3,r.masalah,X.text);
      for(let i=0;i<5;i++){const v=5-i;sh.set(row,LC+i,r.L===v?v:'',X.num);sh.set(row,IC+i,r.I===v?v:'',X.num);sh.set(row,SCc+i,r.S===v?v:'',X.num)}
      sh.set(row,OC,c.li,X.num,`SUM(E${R}:I${R})*SUM(J${R}:N${R})`);
      sh.set(row,PC,c.level,X[c.level]);
      const top=rk[r.id]<=3;
      sh.set(row,VC,c.score,top?X.Significant:X.numBold,`SUM(E${R}:I${R})*SUM(J${R}:N${R})*SUM(Q${R}:U${R})`);
      sh.set(row,WC,rk[r.id],top?X.Significant:X.numBold);if(top)sh.set(row,3,r.masalah,X.textRed);row++;}
    if(row-1>start){sh.merge(start,0,row-1,0);sh.merge(start,1,row-1,1)}
  }
  row+=1;sh.set(row,1,'Keterangan tingkat risiko (berdasarkan skor ICRA = L × I × S):',X.bold);row++;
  LEVELS.forEach(l=>{sh.set(row,1,`${l.k} (${l.range})`,X[l.k]);sh.set(row,2,l.act,X.text);sh.merge(row,2,row,8);for(let c=3;c<=8;c++)sh.set(row,c,'',X.text);sh.heights[row]=28;row++});
  sh.set(row,1,'Skor = Likelihood × Impact × Current System. Prioritas = urutan skor tertinggi (skor sama → prioritas sama). Warna merah pada kolom Score/Prioritas = 3 prioritas utama.',X.def);row+=2;
  sh.set(row,1,'Yang Membuat',X.center);sh.set(row,6,'Mengetahui',X.center);sh.merge(row,6,row,12);sh.set(row,15,'Menyetujui',X.center);sh.merge(row,15,row,21);row+=4;
  sh.set(row,1,S.maker,X.center);sh.set(row,6,S.chair,X.center);sh.merge(row,6,row,12);sh.set(row,15,S.director,X.center);sh.merge(row,15,row,21);row++;
  sh.set(row,1,S.makerRole,X.center);sh.set(row,6,S.chairRole,X.center);sh.merge(row,6,row,12);sh.set(row,15,S.directorRole,X.center);sh.merge(row,15,row,21);
  return sh;
}
function exportXlsx(recs){
  if(!recs.length){toast('Tidak ada data untuk diunduh');return}
  const rk=ranks(DB.records);const S=DB.S;const sheets=[];
  const combos=uniq(recs.map(r=>r.tahun+'|'+r.unit)).sort((a,b)=>b.localeCompare(a));
  // 1. lembar ICRA per tahun-unit
  combos.forEach(k=>{const [t,u]=[k.split('|')[0],k.slice(k.indexOf('|')+1)];sheets.push(sheetICRA(t,u,recs.filter(r=>r.tahun+'|'+r.unit===k),rk))});

  const sc=new XSheet('Scoring');sc.set(0,0,`SCORING INFECTION CONTROL RISK ASSESSMENT (ICRA) ${S.hospital.toUpperCase()}`,X.title).merge(0,0,0,9);

  hd.forEach((t,c)=>sc.set(2,c,t,X.headDark));sc.freeze=3;[8,22,9,24,55,10,10,10,12,13].forEach((w,c)=>sc.width(c,w));
  const sorted=[...recs].sort((a,b)=>b.tahun-a.tahun||a.unit.localeCompare(b.unit)||rk[a.id]-rk[b.id]);
  sorted.forEach((r,i)=>{const c=calc(r),R=i+3;[r.tahun,r.unit,rk[r.id],r.subgrup||r.grup,r.masalah,r.L,r.I,r.S].forEach((v,j)=>sc.set(R,j,v,typeof v==='number'?X.num:X.text));const top=rk[r.id]<=3;if(top){sc.set(R,2,rk[r.id],X.Significant);sc.set(R,4,r.masalah,X.textRed)}sc.set(R,8,c.score,top?X.Significant:X.numBold,`F${R+1}*G${R+1}*H${R+1}`);sc.set(R,9,c.level,X[c.level])});
  sheets.push(sc);

async function unzip(buf){
  const dv=new DataView(buf);let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}

  const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const out={};const dec=new TextDecoder();
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(buf,p+46,nl));const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true);
    out[name]={method,data:new Uint8Array(buf,lo+30+lnl+lxl,csize)};p+=46+nl+xl+cl;}
  return out;
}

  return new TextDecoder().decode(bytes);
}

  const relMap={};for(const m of rels.matchAll(/<Relationship\b([^>]*)\/?>/g)){const id=/Id="([^"]+)"/.exec(m[1])?.[1],t=/Target="([^"]+)"/.exec(m[1])?.[1];if(id)relMap[id]=t}
  const ssXml=await readEntry(z['xl/sharedStrings.xml']);const ss=[];
  for(const m of ssXml.matchAll(/<si>([\s\S]*?)<\/si>|<si\/>/g)){ss.push(m[1]?unx([...m[1].replace(/<rPh[\s\S]*?<\/rPh>/g,'').matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')):'')}
  const sheets=[];
  for(const m of wb.matchAll(/<sheet\b([^>]*)\/>/g)){
    const name=unx(/name="([^"]*)"/.exec(m[1])[1]);const rid=/r:id="([^"]+)"/.exec(m[1])?.[1];let tgt=relMap[rid]||'';
    tgt=tgt.startsWith('/')?tgt.slice(1):'xl/'+tgt.replace(/^\.\//,'');
    const xml=await readEntry(z[tgt]);const grid=[];
    for(const c of xml.matchAll(/<c ([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const a=c[1];const r=/r="([A-Z]+)(\d+)"/.exec(a);if(!r)continue;const t=/t="(\w+)"/.exec(a)?.[1];const body=c[2]||'';
      let v=/<v>([\s\S]*?)<\/v>/.exec(body)?.[1];let val=null;
      if(t==='s')val=ss[+v]??'';else if(t==='inlineStr')val=unx([...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''));

const cellStr=v=>v===undefined||v===null?'':String(v).replace(/\s+/g,' ').trim();
const cellNum=v=>{if(typeof v==='number')return v;const s=cellStr(v);return /^\d+(\.\d+)?$/.test(s)?+s:null};

function parseFlat(sh){
  const g=sh.grid;const hr=(g[0]||[]).map(x=>norm(x));if(!hr.includes('id')||!hr.includes('potensi risiko'))return null;
  const ix=n=>hr.indexOf(n);const out=[];let skipped=0;
  const sc=v=>{const n=cellNum(v);if(n!==null)return n;const m=/^\s*([1-5])\b/.exec(cellStr(v));return m?+m[1]:null};
  for(let r=1;r<g.length;r++){const row=g[r];if(!row)continue;const m=cellStr(row[ix('potensi risiko')]);if(!m)continue;
    const L=sc(row[ix('likelihood')]),I=sc(row[ix('impact')]),S=sc(row[ix('current system')]);if(!(L>=1&&L<=5&&I>=1&&I<=5&&S>=1&&S<=5)){skipped++;continue}
    const gv=k=>ix(k)>=0?cellStr(row[ix(k)]):'';const who=gv('diisi oleh');
    out.push({id:gv('id')||null,tahun:cellNum(row[ix('tahun')])||DB.S.year,unit:gv('unit')||'Rumah Sakit',grup:gv('grup risiko'),subgrup:gv('sub grup'),masalah:m,L,I,S,
      status:STATUS.includes(gv('status'))?gv('status'):'Belum',tujuan:gv('tujuan'),indikator:gv('indikator'),rencana:gv('rencana tindak lanjut'),pic:gv('pic'),target:gv('target waktu'),bukti:gv('bukti evaluasi'),ket:[gv('keterangan'),who?'Diisi oleh: '+who:''].filter(Boolean).join(' · ')});}

}
function parseTemplate(sh){
  const g=sh.grid;
  for(let w=0;w<Math.min(g.length,40);w++){const row=g[w]||[];const runs=[];
    for(let c=0;c<row.length;c++){if([5,4,3,2,1].every((v,i)=>weightOf(row[c+i])===v)){runs.push(c);c+=4}}
    if(runs.length<3)continue;
    const blocks=runs.slice(0,3);const first=blocks[0];
    const hdr=c=>{let s='';for(let k=1;k<=4&&w-k>=0;k++)for(let j=0;j<5;j++)s+=' '+cellStr((g[w-k]||[])[c+j]);return s.toLowerCase()};
    const kinds=blocks.map(c=>{const h=hdr(c);return /current|kesiapan|preparedness|sistem|system/.test(h)?'S':/impact|dampak|consequen/.test(h)?'I':/likel|probab|kemungkinan|frekuensi/.test(h)?'L':null});
    ['L','I','S'].forEach(k=>{if(!kinds.includes(k)){const i=kinds.indexOf(null);if(i>=0)kinds[i]=k}});
    const blk={};blocks.forEach((c,i)=>blk[kinds[i]]=c);
    // kolom teks
    const th=c=>{let s='';for(let k=0;k<=4&&w-k>=0;k++)s+=' '+cellStr((g[w-k]||[])[c]);return s.toLowerCase()};
    let mCol=-1,gCol=-1,sCol=-1;
    for(let c=0;c<first;c++){const h=th(c);if(mCol<0&&/potens|potential|masalah|event|problem|kondisi/.test(h))mCol=c;else if(/sub/.test(h)&&sCol<0)sCol=c;else if(gCol<0&&/grup|group|kategori/.test(h))gCol=c}
    if(mCol<0){let best=-1,bc=0;for(let c=0;c<first;c++){let n=0;for(let r=w+1;r<g.length;r++)if(typeof (g[r]||[])[c]==='string'&&cellStr(g[r][c]).length>3)n++;if(n>bc){bc=n;best=c}}mCol=best}
    if(mCol<0)return null;
    // tahun & unit default
    let title='';for(let r=0;r<w;r++)(g[r]||[]).forEach(v=>{if(typeof v==='string')title+=' '+v});
    const ym=/\b(20\d\d)\b/.exec(title)||/\b(20\d\d)\b/.exec(sh.name);const ys=/\b(\d{2})\s*$/.exec(sh.name.trim());
    const tahun=ym?+ym[1]:ys?2000+ +ys[1]:DB.S.year;
    let unit=sh.name.replace(/icra/ig,'').replace(/\b20\d\d\b|\b\d{2}\s*$/g,'').replace(/\s+/g,' ').trim();
    if(!unit||/^all/i.test(unit))unit='Seluruh Departemen';
    if(unit===unit.toUpperCase()&&unit.length>4)unit=unit.toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase());
    const out=[];let skipped=0,cg='',cs='';
    for(let r=w+1;r<g.length;r++){const row=g[r]||[];const m=cellStr(row[mCol]);
      if(gCol>=0&&cellStr(row[gCol]))cg=cellStr(row[gCol]).replace(/[;:]\s*$/,'');
      if(sCol>=0&&cellStr(row[sCol]))cs=cellStr(row[sCol]);
      if(!m)continue;
      if(/^(yang membuat|mengetahui|menyetujui|disetujui|disiapkan|nama\s*:|kesimpulan|note|keterangan|catatan)/i.test(m))continue;
      const val=k=>{const c0=blk[k];for(let j=0;j<5;j++){const v=row[c0+j];if(v!==undefined&&v!==null&&cellStr(v)!==''&&v!==false)return 5-j}return null};
      const L=val('L'),I=val('I'),S=val('S');
      if(!L&&!I&&!S){if(gCol<0){cg=m.replace(/^([a-z]|\d+)[.)]\s*/i,'').replace(/[:;]\s*$/,'');cs=''}else skipped++;continue}
      if(!L||!I||!S){skipped++;continue}
      out.push({tahun,unit,grup:cg,subgrup:sCol>=0?cs:'',masalah:m,L,I,S});
    }
    return {kind:'template',records:out,skipped,tahun,unit};
  }
  return null;
}

    .forEach((s,i)=>sh.set(first+i,25,s,i===0?X.bold:X.def));

    sh.set(r,OC,0,X.num,`SUM(E${R}:I${R})*SUM(J${R}:N${R})`);sh.set(r,PC,'',X.num,`IF(V${R}=0,"",IF(V${R}>=15,"Significant",IF(V${R}>=10,"High",IF(V${R}>=5,"Moderate","Low"))))`);sh.set(r,VC,0,X.numBold,`SUM(E${R}:I${R})*SUM(J${R}:N${R})*SUM(Q${R}:U${R})`);sh.set(r,WC,'',X.numBold)}

function detectSheets(sheets){
  return sheets.map(sh=>{const f=parseFlat(sh);if(f)return {name:sh.name,kind:'flat',res:f};const tp=parseTemplate(sh);return tp?{name:sh.name,kind:'template',res:tp}:null}).filter(Boolean);
}
function chooseSheets(fileName,found,saved){
  return new Promise(resolve=>{
    const sv=new Map((saved||[]).map(s=>[s.name,s]));const anySaved=sv.size>0;
    const defChk=f=>anySaved?sv.has(f.name):(f.kind==='flat'||/all dep/i.test(f.name)&&f.res.tahun===Math.max(...found.filter(x=>/all dep/i.test(x.name)).map(x=>x.res.tahun)));
    $('#modal').innerHTML=`<h2>Pilih lembar Excel yang disinkronkan</h2><p class="muted" style="margin-top:0">${esc(fileName)} · centang lembar yang diisi departemen. Pilihan ini disimpan dan dipakai setiap kali sinkron.</p>
     <div class="table-wrap" style="max-height:55vh"><table class="dt"><thead><tr><th class="nosort"></th><th class="nosort">Lembar</th><th class="nosort num">Baris terisi</th><th class="nosort num">Belum diisi</th><th class="nosort">Tahun</th><th class="nosort">Unit / Area</th></tr></thead><tbody>
     ${found.map((f,i)=>{const s=sv.get(f.name);return `<tr><td><input type="checkbox" data-i="${i}" ${defChk(f)?'checked':''}></td><td><b>${esc(f.name)}</b><div class="small muted">${f.kind==='flat'?'Format tabel (Data)':'Format ICRA (kolom 5-4-3-2-1)'}</div></td><td class="num">${f.res.records.length}</td><td class="num">${f.res.skipped||0}</td>
      <td>${f.kind==='flat'?'—':`<input type="number" data-t="${i}" value="${s?s.tahun:f.res.tahun}" style="width:84px">`}</td><td>${f.kind==='flat'?'—':`<input type="text" data-u="${i}" value="${esc(s?s.unit:f.res.unit)}" list="dlUnits3">`}</td></tr>`}).join('')}
     </tbody></table></div><datalist id="dlUnits3">${uniq([...units(),...DEFAULT_UNITS]).map(u=>`<option value="${esc(u)}">`).join('')}</datalist>
     <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="csCancel">Batal</button><button class="btn primary" id="csOk">Simpan pilihan &amp; sinkron</button></div>`;
    $('#modalBg').style.display='flex';
    $('#csCancel').onclick=()=>{$('#modalBg').style.display='none';resolve(null)};
    $('#csOk').onclick=()=>{const sel=$$('#modal input[type=checkbox]:checked').map(c=>+c.dataset.i);if(!sel.length){toast('Pilih minimal satu lembar');return}
      const cfg=sel.map(i=>{const f=found[i];return f.kind==='flat'?{name:f.name,kind:'flat'}:{name:f.name,kind:'template',tahun:+$(`#modal [data-t="${i}"]`).value,unit:$(`#modal [data-u="${i}"]`).value.trim()||f.res.unit}});
      $('#modalBg').style.display='none';resolve(cfg)};
  });
}
async function readHandle(h,interactive){
  let perm=await h.queryPermission({mode:'read'});
  if(perm!=='granted'&&interactive)perm=await h.requestPermission({mode:'read'});
  if(perm!=='granted')return null;
  const file=await h.getFile();return {file,sheets:await readXlsx(await file.arrayBuffer())};
}
async function connectExcel(){
  try{const [h]=await window.showOpenFilePicker({types:[{description:'File Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx','.xlsm']}}]});
    const rd=await readHandle(h,true);if(!rd)return;
    const found=detectSheets(rd.sheets);if(!found.length){alert('Tidak ada lembar format ICRA (baris 5-4-3-2-1) di file ini.');return}
    const cfg=await chooseSheets(h.name,found,null);if(!cfg)return;
    await DB.setSetting('excelHandle',h);await DB.setSetting('excelName',h.name);await DB.setSetting('excelSheets',cfg);await syncExcel(true);}
  catch(err){if(err.name!=='AbortError')alert('Gagal menghubungkan file: '+err.message)}
}
async function changeSheets(){
  const h=DB.settings.excelHandle;if(!h)return;
  try{const rd=await readHandle(h,true);if(!rd)return;const cfg=await chooseSheets(h.name,detectSheets(rd.sheets),DB.settings.excelSheets);if(!cfg)return;await DB.setSetting('excelSheets',cfg);await syncExcel(true)}
  catch(err){alert('Gagal membaca file: '+err.message)}
}
async function syncExcel(interactive){
  const h=DB.settings.excelHandle;if(!h){toast('Belum ada file Excel yang terhubung');return false}
  try{
    const rd=await readHandle(h,interactive);if(!rd){if(interactive)toast('Izin membaca file belum diberikan');return false}
    let cfg=DB.settings.excelSheets;
    if(!cfg||!cfg.length){const found=detectSheets(rd.sheets);cfg=await chooseSheets(h.name,found,null);if(!cfg)return false;await DB.setSetting('excelSheets',cfg)}
    let recs=[],skipped=0;const missing=[];const res={add:0,upd:0,skip:0,unch:0,del:0};const perSheet=[];
    const prev=DB.settings.excelSync;const fileSame=prev&&prev.fileModified===rd.file.lastModified;
    for(const c of cfg){const sh=rd.sheets.find(s=>s.name===c.name);if(!sh){missing.push(c.name);continue}
      let part=[];
      if(c.kind==='flat'){const f=parseFlat(sh);if(f){part=f.records;skipped+=f.skipped}}
      else{const tp=parseTemplate(sh);if(tp){part=tp.records.map(r=>({...r,tahun:c.tahun,unit:c.unit}));skipped+=tp.skipped}}
      perSheet.push({name:c.name,unit:c.unit||'',tahun:c.tahun||'',filled:part.length,units:uniq(part.map(r=>r.unit)).join(', ')});
      recs.push(...part);const m=await mergeIncoming(part,'xl:'+c.name);['add','upd','skip','unch'].forEach(k=>res[k]+=m[k]);}
    if(missing.length&&interactive)alert('Lembar berikut tidak ditemukan di file: '+missing.join(', ')+'\nData dari lembar itu tidak diubah. Gunakan "Pilih lembar" untuk memperbarui pilihan.');
    // hapus data yang sudah tidak ada / dikosongkan di Excel (hanya data yang berasal dari sinkron lembar tsb)
    const keyOf=r=>r.tahun+'|'+norm(r.unit)+'|'+norm(r.masalah);
    const present=new Set(recs.map(keyOf)),presentIds=new Set(recs.filter(r=>r.id).map(r=>r.id));
    const scopes=cfg.filter(c=>!missing.includes(c.name));
    const toDel=DB.records.filter(r=>r.source&&scopes.some(c=>r.source==='xl:'+c.name&&(c.kind==='flat'||(+r.tahun===+c.tahun&&r.unit===c.unit)))&&!present.has(keyOf(r))&&!presentIds.has(r.id));
    let pendingDel=0;
    if(toDel.length){
      const ok=interactive&&confirm(`${toDel.length} data sudah dihapus atau dikosongkan di Excel:\n\n${toDel.slice(0,10).map(r=>'• '+trunc(r.masalah,70)+' ('+r.unit+' '+r.tahun+')').join('\n')}${toDel.length>10?'\n• … dan '+(toDel.length-10)+' lainnya':''}\n\nHapus juga dari dashboard? (Bisa dikembalikan lewat tombol "Kembalikan")`);
      if(ok){await DB.del(toDel.map(r=>r.id));await DB.setSetting('syncTrash',{at:new Date().toISOString(),records:toDel});res.del=toDel.length}else pendingDel=toDel.length;
    }
    const info={perSheet,fileSame,at:new Date().toISOString(),fileModified:rd.file.lastModified,rows:recs.length,skipped,pendingDel,sheets:cfg.map(c=>c.name),...res};
    await DB.setSetting('excelSync',info);
    if(res.add||res.upd||res.del){const log=DB.settings.mergeLog||[];log.push({at:info.at,file:'Sinkron: '+h.name+(res.del?` (${res.del} dihapus)`:''),units:uniq(recs.map(r=>r.unit)).join(', '),add:res.add,upd:res.upd});await DB.setSetting('mergeLog',log.slice(-50))}
    // arahkan filter dashboard ke tahun/unit hasil sinkron agar data langsung terlihat
    if(res.add||res.upd){const c0=cfg.find(c=>c.kind==='template'&&!missing.includes(c.name));if(c0){UI.dash.tahun=String(c0.tahun);UI.dash.unit=c0.unit}}
    if(interactive&&fileSame&&!res.add&&!res.upd&&!res.del){
      alert(`Tidak ada perubahan yang terbaca.\n\nFile "${h.name}" di komputer ini terakhir berubah pada ${new Date(rd.file.lastModified).toLocaleString('id-ID')}, sama seperti saat sinkron sebelumnya.\n\nKemungkinan penyebab:\n1. OneDrive di komputer ini belum mengunduh perubahan dari departemen. Cek ikon awan OneDrive di taskbar (harus centang hijau / "Up to date"), tunggu 1–2 menit, lalu sinkron lagi.\n2. File yang dihubungkan bukan file OneDrive yang dibagikan (misalnya salinan di folder Downloads/Desktop). Klik "Ganti file Excel" lalu pilih file dari folder OneDrive.\n3. Departemen mengisi salinan lain (mengunduh lalu mengedit di komputernya sendiri), bukan lewat link bersama.`);
    }
    toast(`Sinkron Excel selesai: ${res.add} baru, ${res.upd} diperbarui, ${res.del} dihapus, ${res.unch} tetap${pendingDel?` · ${pendingDel} menunggu konfirmasi hapus`:''}`,5000);render();return true;
  }catch(err){if(interactive)alert('Sinkron gagal: '+err.message+(err.name==='NotFoundError'?'\n\nFile tidak ditemukan. Pastikan OneDrive tersinkron atau hubungkan ulang file Excel.':''));return false}
}

}
function viewShare(el){
  const ys=years(),us=units();const log=DB.settings.mergeLog||[];
  el.innerHTML=`<div class="page-head"><div><h1>${srcExcel()?'Excel OneDrive &amp; Bagikan':'Bagikan &amp; Gabung Data'}</h1><p>${srcExcel()?'Hubungkan dan sinkronkan Excel ICRA di OneDrive, lalu bagikan laporan baca-saja ke departemen.':'Departemen lain bisa melihat dashboard dan ikut mengisi ICRA unitnya, tanpa internet dan tanpa mengubah data Anda secara langsung.'}</p></div></div>
  <div class="card dash-only" style="margin-bottom:14px"><h3>Cara kerjanya</h3>
   <ol class="steps"><li>Unduh <b>File Input Departemen</b> di bawah, lalu bagikan: unggah ke server/intranet RS (tim IT memberi link-nya) atau kirim lewat WA/email.</li>
   <li>Departemen membuka file/link itu, mengisi ICRA unitnya, lalu menekan <b>Kirim Data ke PPI</b>. Hasilnya berupa file data kecil (.json) yang dikirim ke Anda lewat WA/email.</li>
   <li>Anda menggabungkan file itu di bagian <b>Gabungkan data dari departemen</b>. Data langsung masuk ke dashboard utama ini.</li>
   <li>Untuk berbagi hasil, unduh <b>Laporan Baca-saja</b> (grafik, matriks, tabel, unduh Excel) lalu bagikan dengan cara yang sama.</li></ol>
   <p class="small muted" style="margin:8px 0 0">File utama ini (berisi seluruh data &amp; fitur gabung) sebaiknya tetap di komputer Anda, jangan diunggah ke server.</p></div>
  <div class="grid g2" style="align-items:start">
   ${excelSyncCard()}
   <div class="card dash-only"><h3>1. File Input Departemen</h3><p class="sub">Formulir input + dashboard untuk departemen. Berisi daftar unit, grup risiko &amp; potensial risiko dari Excel Anda, tetapi <b>tidak berisi data RS</b>. Cukup dibuat sekali, kecuali daftar pilihan berubah.</p>
    <div class="row"><button class="btn primary" id="shDeptHtml">⬇ Unduh file (.html), untuk server/intranet</button><button class="btn" id="shDeptZip">⬇ Unduh .zip, untuk WA/email</button></div></div>
   <div class="card"><h3>Laporan Baca-saja</h3><p class="sub">Salinan dashboard berisi data per hari ini. Penerima bisa melihat grafik/tabel &amp; mengunduh Excel, tetapi tidak bisa mengubah data. Buat ulang setiap kali data diperbarui.</p>
    <div class="row" style="margin-bottom:10px"><label class="f">Tahun<select id="shT">${filterOpts('',ys,'Semua tahun')}</select></label><label class="f">Unit<select id="shU">${filterOpts('',us,'Semua unit')}</select></label></div>
    <div class="row"><button class="btn primary" id="shViewHtml">⬇ Unduh laporan (.html)</button><button class="btn" id="shViewZip">⬇ Unduh .zip, untuk WA/email</button></div></div>
   <div class="card dash-only"><h3>3. Gabungkan data dari departemen</h3><p class="sub">Pilih satu atau beberapa file data dari departemen (.json, atau file Excel hasil unduhan dashboard). Data dengan masalah yang sama (tahun + unit + masalah) akan diperbarui, bukan digandakan.</p>
    <div class="row"><button class="btn primary" id="shMerge">⬆ Pilih file data departemen</button></div>
    <input type="file" id="fileMerge" accept=".json,.xlsx" multiple class="hidden">
    ${log.length?`<div class="table-wrap" style="margin-top:12px;max-height:240px"><table class="dt"><thead><tr><th class="nosort">Tanggal</th><th class="nosort">File</th><th class="nosort">Unit</th><th class="nosort num">Baru</th><th class="nosort num">Diperbarui</th></tr></thead><tbody>${[...log].reverse().map(l=>`<tr><td class="small">${fmtDate(l.at)}</td><td class="small">${esc(l.file)}</td><td class="small">${esc(l.units)}</td><td class="num">${l.add}</td><td class="num">${l.upd}</td></tr>`).join('')}</tbody></table></div>`:''}</div>
   <div class="card"><h3>Catatan untuk server / intranet RS</h3><ul class="steps">
    <li>Minta tim IT menaruh file .html di server web internal (cukup sebagai file statis). Link-nya hanya bisa dibuka dari jaringan RS.</li>
    <li>Setiap komputer departemen menyimpan isiannya di browser masing-masing, jadi tetap rutin kirim data ke PPI.</li>
    <li>Saat dikirim lewat WA, kirim sebagai <b>Dokumen</b>. Kalau email RS memblokir file .html, gunakan versi .zip. Penerima cukup mengekstrak lalu membuka file .html di Chrome/Edge.</li>
    <li>Jangan unggah laporan ke situs atau link yang terbuka untuk umum.</li></ul></div>
  </div>`;
  const dept=z=>deliverHtml(buildCopy({mode:'dept',createdAt:new Date().toISOString(),profile:DB.S}),'ICRA_Input_Departemen',z);
  $('#shDeptHtml').onclick=()=>dept(false);$('#shDeptZip').onclick=()=>dept(true);
  const view=z=>{const t=$('#shT').value,u=$('#shU').value;const recs=DB.records.filter(r=>(!t||+r.tahun===+t)&&(!u||r.unit===u));
    if(!recs.length){toast('Tidak ada data untuk filter ini');return}
    const scope=`${u||'Semua unit'} · ${t?'Tahun '+t:'Semua tahun'}`;
    deliverHtml(buildCopy({mode:'view',createdAt:new Date().toISOString(),scope,profile:DB.S,data:recs}),`ICRA_Laporan_${(u||'Semua_unit')}_${t||'semua_tahun'}_${stamp()}`.replace(/[^\w\-]+/g,'_'),z)};
  $('#shViewHtml').onclick=()=>view(false);$('#shViewZip').onclick=()=>view(true);
  bindExcelSync();
  $('#shMerge').onclick=()=>$('#fileMerge').click();
  $('#fileMerge').onchange=async e=>{
    const files=[...e.target.files];e.target.value='';if(!files.length)return;
    const log=DB.settings.mergeLog||[];let msg=[];
    for(const file of files){
      try{let recs=[];
        if(/\.json$/i.test(file.name)){const d=JSON.parse(await file.text());recs=Array.isArray(d)?d:(d.records||[]);}
        else{const sh=(await readXlsx(await file.arrayBuffer())).map(parseFlat).find(x=>x&&x.records.length);if(!sh)throw new Error('lembar "Data" tidak ditemukan');recs=sh.records}
        const unitsIn=uniq(recs.map(r=>r.unit)).join(', ');
        if(!confirm(`${file.name}\n${recs.length} data · unit: ${unitsIn||'-'}\n\nGabungkan ke dashboard utama?`))continue;
        const res=await mergeIncoming(recs);log.push({at:new Date().toISOString(),file:file.name,units:unitsIn,add:res.add,upd:res.upd});
        msg.push(`${file.name}: ${res.add} baru, ${res.upd} diperbarui${res.skip?`, ${res.skip} dilewati`:''}`);
      }catch(err){msg.push(`${file.name}: gagal (${err.message})`)}
    }
    await DB.setSetting('mergeLog',log.slice(-50));render();if(msg.length)alert('Hasil penggabungan:\n\n'+msg.join('\n'));
  };
}
function viewSend(el){
  const ys=years(),us=units();const last=DB.settings.lastSent;
  el.innerHTML=`<div class="page-head"><div><h1>Kirim Data ke Komite PPI</h1><p>Data yang Anda isi tersimpan di komputer ini. Agar masuk ke dashboard PPI, unduh file data lalu kirim ke IPCN.</p></div></div>
  ${backupBanner()}
  <div class="grid g2" style="align-items:start">
   <div class="card"><h3>Unduh file data</h3><p class="sub">Terakhir dikirim: ${last?fmtDate(last):'belum pernah'} · total ${DB.records.length} data di komputer ini</p>
    <div class="row" style="margin-bottom:10px"><label class="f">Tahun<select id="sdT">${filterOpts(ys[0]??'',ys,'Semua tahun')}</select></label><label class="f">Unit<select id="sdU">${filterOpts('',us,'Semua unit')}</select></label></div>
    <div id="sdInfo" class="small muted" style="margin-bottom:10px"></div>
    <div class="row"><button class="btn primary" id="sdJson">📤 Unduh file data untuk PPI (.json)</button><button class="btn" id="sdXlsx">⬇ Excel (arsip unit)</button></div></div>
   <div class="card"><h3>Langkah pengiriman</h3><ol class="steps">
    <li>Pilih tahun &amp; unit, lalu klik <b>Unduh file data untuk PPI</b>.</li>
    <li>Kirim file <b>.json</b> yang terunduh ke IPCN lewat WhatsApp (sebagai Dokumen) atau email.</li>
    <li>IPCN menggabungkannya ke dashboard utama. Kalau ada perubahan, cukup kirim ulang. Data yang sama akan diperbarui, tidak digandakan.</li></ol></div>
  </div>`;
  const pick=()=>{const t=$('#sdT').value,u=$('#sdU').value;return DB.records.filter(r=>(!t||+r.tahun===+t)&&(!u||r.unit===u))};
  const info=()=>{const l=pick();$('#sdInfo').textContent=`${l.length} data akan dikirim · unit: ${uniq(l.map(r=>r.unit)).join(', ')||'-'}`};
  $('#sdT').onchange=info;$('#sdU').onchange=info;info();
  $('#sdJson').onclick=async()=>{const l=pick();if(!l.length){toast('Belum ada data untuk dikirim');return}
    const u=$('#sdU').value||uniq(l.map(r=>r.unit)).join('-');const t=$('#sdT').value||'semua';
    download(new Blob([JSON.stringify({app:'ICRA-Dashboard',kind:'kiriman-departemen',exportedAt:new Date().toISOString(),units:uniq(l.map(r=>r.unit)),records:l},null,1)],{type:'application/json'}),`ICRA_Data_${u}_${t}_${stamp()}.json`.replace(/[^\w.\-]+/g,'_'));
    await DB.setSetting('lastSent',new Date().toISOString());toast('File data diunduh. Kirim file ini ke IPCN.',4000);render()};
  $('#sdXlsx').onclick=()=>exportXlsx(pick());
}

/* ===================== START ===================== */
(async()=>{
  document.body.classList.add('mode-'+MODE);
  $$('.only-main').forEach(b=>b.classList.toggle('hidden',MODE!=='main'||SIMPLE));$$('.only-dept').forEach(b=>b.classList.toggle('hidden',MODE!=='dept'));
  if(MODE==='view'){
    $$('#nav button').forEach(b=>b.classList.toggle('hidden',!['dashboard','data','guide'].includes(b.dataset.view)));
    $('#logoSub').textContent='Laporan baca-saja';$('#modeTag').innerHTML='<span class="mode-tag">BACA-SAJA</span>';
    $('.side-foot div').innerHTML='<span class="dot"></span>Salinan laporan dari Komite PPI';
    DB.records=(CONFIG.data||[]).map(r=>({...r}));DB.settings={};render();return;
  }
  if(MODE==='server'){await serverStart();return}
  if(MODE==='dept'){$('#logoSub').textContent='Input Departemen';$('#modeTag').innerHTML='<span class="mode-tag">DEPARTEMEN</span>'}
  try{await DB.open();await DB.load()}catch(err){$('#main').innerHTML=`<div class="card">Database tidak dapat dibuka: ${esc(err.message)}. Gunakan Google Chrome atau Microsoft Edge, dan jangan gunakan mode Incognito/InPrivate.</div>`;return}
  if(MODE==='main'&&!DB.records.length&&!DB.settings.initialized){await DB.saveMany(seedRecords());await DB.setSetting('initialized',true)}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  UI.input.tahun=DB.S.year;
  if(MODE==='main'&&!SIMPLE&&DB.settings.excelHandle&&FSA){try{if(await DB.settings.excelHandle.queryPermission({mode:'read'})==='granted')syncExcel(false)}catch(e){}}
  if(MODE==='dept'&&!DB.records.length)VIEW='input',$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='input'));
  render();
})();
</script>
